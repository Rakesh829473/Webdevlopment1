<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Help Center - Cravings</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<section class="policy-hero">
<div class="container text-center text-white">
<h1 class="fw-bold">Help Center</h1>
<p>Get answers to your questions</p>
</div>
</section>

<section class="py-5">
<div class="container">

<div class="accordion mx-auto" style="max-width:750px;" id="faq">

<div class="accordion-item">
<h2 class="accordion-header">
<button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#q1">
How do I track my order?
</button>
</h2>
<div id="q1" class="accordion-collapse collapse show" data-bs-parent="#faq">
<div class="accordion-body">
Go to dashboard → Orders and check active order.
</div>
</div>
</div>

<div class="accordion-item">
<h2 class="accordion-header">
<button class="accordion-button collapsed" data-bs-toggle="collapse" data-bs-target="#q2">
How do I get refund?
</button>
</h2>
<div id="q2" class="accordion-collapse collapse" data-bs-parent="#faq">
<div class="accordion-body">
Submit support ticket with order ID.
</div>
</div>
</div>

</div>

<div class="ticket-box mt-5 mx-auto">
<h3 class="fw-bold mb-4">Submit Support Ticket</h3>

<input class="form-control mb-3" placeholder="Full Name">
<input class="form-control mb-3" placeholder="Email">

<select class="form-select mb-3">
<option>Delivery Issue</option>
<option>Payment Issue</option>
<option>Refund</option>
</select>

<textarea class="form-control mb-3" rows="4" placeholder="Description"></textarea>

<button class="btn btn-main w-100">Submit Ticket</button>

</div>

</div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
