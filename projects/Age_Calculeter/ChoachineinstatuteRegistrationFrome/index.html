<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institute Registration Form</title>

    <link rel="stylesheet" href="style.css">

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
</head>

<body>

<div class="container py-5">

    <h1 class="text-center mb-4 bg-primary text-light p-3 rounded shadow-lg">
        Institute Registration Form
    </h1>

    <div class="form-box">

        <form id="registrationForm">

            <!-- Personal Information -->

            <div class="section-title">
                Personal Information
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">
                    Full Name
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="fullName"
                    placeholder="Enter your name"
                    required
                >

                <span class="text-danger small" id="fullNameError"></span>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">
                    Email Address
                </label>

                <input
                    type="email"
                    class="form-control"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <span class="text-danger small" id="emailError"></span>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">
                    Mobile Number
                </label>

                <input
                    type="tel"
                    class="form-control"
                    id="phone"
                    placeholder="Enter mobile number"
                    required
                >

                <span class="text-danger small" id="phoneError"></span>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">
                    Date of Birth
                </label>

                <input
                    type="date"
                    class="form-control"
                    id="dob"
                >

                <span class="text-danger small" id="dobError"></span>
            </div>

            <!-- Gender -->

            <div class="mb-4 d-flex gap-4 align-items-center flex-wrap">

                <label class="form-label fw-bold m-0">
                    Gender
                </label>

                <div>
                    <input
                        type="radio"
                        name="gender"
                        id="male"
                        value="Male"
                    >
                    <span>Male</span>
                </div>

                <div>
                    <input
                        type="radio"
                        name="gender"
                        id="female"
                        value="Female"
                    >
                    <span>Female</span>
                </div>

                <div>
                    <input
                        type="radio"
                        name="gender"
                        id="others"
                        value="Others"
                    >
                    <span>Others</span>
                </div>

            </div>

            <!-- Academic Details -->

            <div class="section-title">
                Academic Details
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">
                    Last Qualification
                </label>

                <select class="form-select" id="qualification">

                    <option>Select Qualification</option>
                    <option>10th</option>
                    <option>12th</option>
                    <option>Diploma</option>
                    <option>Graduate</option>
                    <option>Postgraduate</option>

                </select>

                <span class="text-danger small" id="qualificationError"></span>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">
                    Percentage
                </label>

                <input
                    type="number"
                    class="form-control"
                    id="percentage"
                    placeholder="Enter percentage"
                >

                <span class="text-danger small" id="percentageError"></span>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">
                    Grade
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="grade"
                    placeholder="Enter Grade"
                >

                <span class="text-danger small" id="gradeError"></span>
            </div>

            <!-- Preferred Course -->

            <div class="mb-3">
                <label class="form-label fw-bold">
                    Preferred Course
                </label>

                <select class="form-select" id="course">

                    <option>Select Course</option>
                    <option>IIT-JEE</option>
                    <option>NEET</option>
                    <option>Banking Exams</option>
                    <option>CA/CS</option>
                    <option>UPSC</option>

                </select>

                <span class="text-danger small" id="courseError"></span>
            </div>

            <!-- Batch Timing -->

            <div class="mb-4">

                <label class="form-label fw-bold d-block mb-2">
                    Batch Timing Preference
                </label>

                <div class="d-flex gap-4 flex-wrap">

                    <div>
                        <input type="checkbox" id="morning">
                        <span>Morning</span>
                    </div>

                    <div>
                        <input type="checkbox" id="afternoon">
                        <span>Afternoon</span>
                    </div>

                    <div>
                        <input type="checkbox" id="evening">
                        <span>Evening</span>
                    </div>

                    <div>
                        <input type="checkbox" id="weekend">
                        <span>Weekend</span>
                    </div>

                </div>

            </div>

            <!-- Address -->

            <div class="section-title">
                Address
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">
                    Residential Address
                </label>

                <textarea
                    class="form-control"
                    rows="4"
                    id="address"
                    placeholder="Enter full address"
                ></textarea>

                <span class="text-danger small" id="addressError"></span>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">
                    City
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="city"
                    placeholder="Enter city"
                >

                <span class="text-danger small" id="cityError"></span>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">
                    Pin Code
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="pin"
                    placeholder="Enter pin code"
                >

                <span class="text-danger small" id="pinError"></span>
            </div>

            <!-- Guardian -->

            <div class="section-title">
                Guardian Details
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">
                    Guardian Name
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="guardianName"
                    placeholder="Enter guardian name"
                >

                <span class="text-danger small" id="guardianNameError"></span>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">
                    Guardian Contact
                </label>

                <input
                    type="tel"
                    class="form-control"
                    id="guardianContact"
                    placeholder="Enter guardian contact"
                >

                <span class="text-danger small" id="guardianContactError"></span>
            </div>

            <!-- Additional Information -->

            <div class="section-title">
                Additional Information
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">
                    How did you hear about us?
                </label>

                <select class="form-select">

                    <option>Select Option</option>
                    <option>Friends</option>
                    <option>Online Ad</option>
                    <option>Newspaper</option>
                    <option>Social Media</option>

                </select>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">
                    Special Requirements
                </label>

                <textarea
                    class="form-control"
                    rows="4"
                    placeholder="Enter requirements"
                ></textarea>
            </div>

            <!-- Buttons -->

            <div class="d-flex justify-content-between gap-3">

                <button
                    type="reset"
                    class="btn btn-secondary w-50"
                >
                    Clear
                </button>

                <button
                    type="submit"
                    class="btn btn-primary w-50"
                >
                    Register Now
                </button>

            </div>

        </form>

    </div>

</div>
<script src="./script.js"></script>

</body>
</html>
