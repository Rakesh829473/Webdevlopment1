<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback - Cravings</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<section class="feedback-page">
<div class="container h-100">
<div class="row h-100 justify-content-end align-items-center">

<div class="col-lg-5">
<div class="form-card">

<h2 class="fw-bold mb-2">Share Feedback</h2>
<p class="text-muted mb-4">Help us improve your Cravings experience.</p>

<form>

<input type="text" class="form-control mb-3" placeholder="Full Name">
<input type="email" class="form-control mb-3" placeholder="Email">

<select class="form-select mb-3">
<option>Food Quality</option>
<option>Delivery Experience</option>
<option>Customer Support</option>
<option>Pricing & Value</option>
</select>

<div class="mb-3 fs-4 text-warning">
☆ ☆ ☆ ☆ ☆
</div>

<textarea class="form-control mb-3" rows="4" placeholder="Your Feedback"></textarea>

<button class="btn btn-main w-100 py-2">Submit Feedback</button>

</form>

</div>
</div>

</div>
</div>
</section>

</body>
</html>
