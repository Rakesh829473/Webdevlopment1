<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Cravings</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<section class="auth-page">
<div class="container-fluid">
<div class="row min-vh-100">

<!-- Form Side -->
<div class="col-lg-6 d-flex align-items-center justify-content-center auth-form-wrap">
<div class="auth-box">

<h2 class="fw-bold mb-4">Create Account</h2>

<div class="user-tabs mb-4">
<span class="active">Customer</span>
<span>Restaurant</span>
<span>Rider</span>
</div>

<form>

<input type="text" class="form-control mb-3" placeholder="Full Name">
<input type="email" class="form-control mb-3" placeholder="Email Address">
<input type="tel" class="form-control mb-3" placeholder="Phone Number">
<input type="password" class="form-control mb-3" placeholder="Password">
<input type="password" class="form-control mb-3" placeholder="Confirm Password">

<div class="form-check mb-3">
<input class="form-check-input" type="checkbox">
<label class="form-check-label">
I agree to Terms & Conditions
</label>
</div>

<button class="btn btn-main w-100 py-2">Create Account</button>

<p class="text-center mt-4">
Already have an account?
<a href="login.html">Login</a>
</p>

</form>

</div>
</div>

<!-- Right Side -->
<div class="col-lg-6 d-none d-lg-flex auth-side">
<div class="auth-content text-white text-center">
<h1 class="fw-bold">Join Cravings Today!</h1>
<p>Become a customer, restaurant partner, or rider.</p>
</div>
</div>

</div>
</div>
</section>

</body>
</html>
