<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Electricity Bill Calculator</title>

    <!-- Bootstrap CSS -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <!-- Main Card -->
                <div class="card shadow-lg bill-card border-0">

                    <div class="card-header bg-primary text-white text-center py-3">
                        <h2>Electricity Bill Calculator</h2>
                    </div>

                    <div class="card-body p-4">

                        <!-- Input -->
                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Enter Electricity Units
                            </label>

                            <input 
                                type="number"
                                id="units"
                                class="form-control"
                                placeholder="Enter Units"
                            >

                        </div>

                        <!-- Buttons -->
                        <div class="d-flex gap-3">

                            <button 
                                class="btn btn-success w-100 btn-custom"
                                onclick="calculateBill()"
                            >
                                Calculate
                            </button>

                            <button 
                                class="btn btn-danger w-100 btn-custom"
                                onclick="resetBill()"
                            >
                                Reset
                            </button>

                        </div>

                        <!-- Result Card -->
                        <div 
                            id="resultCard"
                            class="card mt-4 shadow-sm d-none"
                        >

                            <div class="card-header ">
                                Bill Details
                            </div>

                            <div class="card-body">

                                <p id="slab1"></p>
                                <p id="slab2"></p>
                                <p id="slab3"></p>
                                <p id="slab4"></p>

                                <hr>

                                <p class="fw-bold" id="subtotal"></p>

                                <p class="fw-bold text-warning" id="surcharge"></p>

                                <h4 class="text-success" id="grandTotal"></h4>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
