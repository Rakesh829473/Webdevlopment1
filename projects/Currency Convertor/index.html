<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        body {
            background: linear-gradient(to right, #1d2671, #c33764);
            height: 100vh;
        }

        .converter-card {
            width: 420px;
            border-radius: 20px;
            
        }

        .flag {
            width: 60px;
            height: 40px;
            object-fit: cover;
            border-radius: 5px;
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center ">

    <div class="card converter-card shadow-lg p-4">

        <h2 class="text-center mb-4">
            <i class="bi bi-currency-exchange"></i>
            Currency Converter
        </h2>

        <!-- Amount -->
        <div class="mb-3">
            <label class="form-label">Enter Amount</label>
            <input type="number" id="amount" class="form-control" value="1">
        </div>

        <!-- From -->
        <div class="row">

            <div class="col-5">

                <label class="form-label">From</label>

                <div class="d-flex align-items-center gap-2">

                    <img id="fromFlag"
                        src="https://flagsapi.com/US/flat/64.png"
                        class="flag">

                    <select id="fromCurrency" class="form-select"></select>

                </div>

            </div>

            <!-- Swap Icon -->
            <div class="col-2 d-flex justify-content-center align-items-center mt-4">
                <i class="bi bi-arrow-left-right fs-3"></i>
            </div>

            <!-- To -->
            <div class="col-5">

                <label class="form-label">To</label>

                <div class="d-flex align-items-center gap-2">

                    <img id="toFlag"
                        src="https://flagsapi.com/IN/flat/64.png"
                        class="flag">

                    <select id="toCurrency" class="form-select"></select>

                </div>

            </div>

        </div>

        <!-- Button -->
        <button class="btn btn-primary w-100 mt-4" id="convertBtn">
            Convert
        </button>

        <!-- Result -->
        <div class="alert alert-success mt-4 text-center">

            <h5 id="result">
                1 USD = 83 INR
            </h5>

        </div>

    </div>

    <!-- JavaScript -->
    
    <script src="./javaScript.js"></script>

</body>

</html>
