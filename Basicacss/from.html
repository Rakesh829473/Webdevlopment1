<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login & Registration</title>

<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet" href="./stylefrom.css">
</head>
<body>

<div class="container">

    <!-- Login -->
    <div class="card">
        <h2>Login</h2>
        <br>

        <div class="input-box">
            <i class="fa fa-envelope"></i>
            <input type="email" placeholder="Enter your email" required>
            <hr>
        </div>

        <div class="input-box">
            <i class="fa fa-lock"></i>
            <input type="password" placeholder="Confirm password" required>
            <hr>
            <i class="fa fa-eye eye"></i>
        </div>

        <div class="row">
            <label><input type="checkbox"> Remember me</label>
            <a href="#">     Forgot password?</a>
        </div>
        <br>
         
                <button>Login Now</button>
         
         <br><br>
        

        <p id="abc">Don't have an account? <a href="#">Signup now</a></p>
    </div>

    <!-- Registration -->
    <div class="card">
        <h2>Registration</h2>
        <br><br>

        <div class="input-box">
            <i class="fa fa-user"></i>
            <input type="text" placeholder="Enter your name" required>
            <hr>
        </div>

        <div class="input-box">
            <i class="fa fa-envelope"></i>
            <input type="email" placeholder="Enter your email" required>
            <hr>
        </div>

        <div class="input-box">
            <i class="fa fa-lock"></i>
            <input type="password" placeholder="Create a password" required>
            <hr>
        </div>

        <div class="input-box">
            <i class="fa fa-lock"></i>
            <input type="password" placeholder="Confirm a password" required>
            <hr>
            <i class="fa fa-eye eye"></i>
        </div>

        <div class="row">
            <label><input type="checkbox"> I accept all terms & conditions</label>
            <br><br>
        </div>

        <button>Register Now</button>
        <br><br>

        <p id="abc">    Already have an account? <a href="#">Login now</a></p>
       
        </div>
