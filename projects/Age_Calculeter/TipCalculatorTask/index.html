<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tip Calculator</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-primary d-flex justify-content-center align-items-center vh-100">

    <div style="width: 360px;">

        <!-- Top Heading -->
        <div  class=" bg-warning text-white text-center py-3 rounded-top-5 fs-3 " >
            TIP CALCULATOR
        </div>

        <!-- Card -->
        <div class="card p-4 shadow rounded-bottom-4 border-0">

            <!-- Bill Amount -->
            <div class="mb-3">
                <label class="form-label">How much was your bill?</label>

                <div class="input-group">
                    <span class="input-group-text">₹</span>

                    <input 
                        type="number" 
                        id="billAmount" 
                        class="form-control"
                        placeholder="Enter Amount"
                    >
                </div>
            </div>

            <!-- Service -->
            <div class="mb-3">
                <label class="form-label">How was the service?</label>

                <select id="service" class="form-select">
                    <option value="0.25">25% - Top Notch</option>
                    <option value="0.20">20% - Excellent</option>
                    <option value="0.15">15% - Good</option>
                    <option value="0.10">10% - Bad</option>
                    <option value="0.05">5% - Worst</option>
                </select>
            </div>

            <!-- People -->
            <div class="mb-3">
                <label class="form-label">Total number of persons</label>

                <input 
                    type="number" 
                    id="people" 
                    class="form-control"
                    placeholder="Number of People"
                >
            </div>

            <!-- Button -->
            <button 
                class="btn btn-info text-white w-100"
                onclick="calculateTip()"
            >
                Calculate
            </button>

            <!-- Result -->
            <div id="resultBox" class="text-center mt-4 d-none">

                <h4>Tip Amount</h4>
                <h3 id="tipAmount">₹0</h3>

                <h4 class="mt-3">Each Person Pays</h4>
                <h3 id="perPerson">₹0</h3>

                
            </div>

        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
