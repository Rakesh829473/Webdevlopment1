<!DOCTYPE html>
<html>
<head>
    <title>Doctor Appointment Form</title>
</head>
<body>

<h2 align="center">Doctor Appointment Form</h2>

<table align="center">
<tr>

<!-- LEFT SIDE IMAGE -->
<td>
    <img src="https://i.etsystatic.com/32486242/r/il/f73b28/5362741236/il_fullxfull.5362741236_pq3z.jpg" width="350" height="350">
</td>

<!-- RIGHT SIDE FORM -->
<td>
<form>

<p>Appointment Date:
<input type="date"></p>

<p>Appointment Time:
<input type="time"></p>

<p>Name:
<input type="text" placeholder="First">
<input type="text" placeholder="Last">
</p>

<p>Gender:
Male <input type="radio" name="gender">
Female <input type="radio" name="gender">
</p>

<p>Phone:
<input type="text"></p>

<p>Address:
<input type="text" placeholder="City">
<input type="text" placeholder="State">
</p>

<p>Your Query:
<br>
<textarea rows="4" cols="30"></textarea>
</p>

<p>Appointment Type:</p>

<input type="checkbox"> Cervix checkup <br>
<input type="checkbox"> Heart checkup <br>
<input type="checkbox"> Eye checkup <br>
<input type="checkbox"> Hearing Test <br>

<br>

<input type="submit" value="Submit">

</form>
</td>

</tr>
</table>

</body>
</html>
