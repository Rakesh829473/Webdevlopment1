<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Bill Calculator</title>

    <!-- Bootstrap CSS -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <!-- Main Card -->
                <div class="card shadow-lg border-0 travel-card">

                    <!-- Header -->
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h2>Travel Bill Calculator</h2>
                    </div>

                    <!-- Body -->
                    <div class="card-body p-4">

                        <!-- Input -->
                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Kilometers Covered
                            </label>

                            <input 
                                type="number"
                                step="0.1"
                                id="kilometers"
                                class="form-control"
                                placeholder="Enter Kilometers"
                            >

                            <!-- Validation -->
                            <small 
                                id="error"
                                class="text-danger d-none"
                            >
                                Please enter a non-negative number of kilometres
                            </small>

                        </div>

                        <!-- Button -->
                       <!-- Buttons -->
<div class="d-flex gap-3">

    <button 
        class="btn btn-primary w-100 btn-custom"
        onclick="calculateBill()"
    >
        Calculate Bill
    </button>

    <button 
        class="btn btn-danger w-100 btn-custom"
        onclick="resetBill()"
    >
        Reset
    </button>

</div>

                        <!-- Result Card -->
                        <div 
                            id="resultCard"
                            class="card mt-4 shadow-sm d-none"
                        >

                            <div class="card-header bg-dark text-white">
                                Bill Details
                            </div>

                            <div class="card-body">

                                <h4 
                                    class="text-success text-center mb-4"
                                    id="totalBill"
                                >
                                </h4>

                                <p id="slab1"></p>

                                <p id="slab2"></p>

                                <p id="slab3"></p>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
