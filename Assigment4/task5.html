<!DOCTYPE html>
<html>
<head>
    <title>Application Form</title>
</head>
<body>

    <h1>Application Form</h1>

    <form>

        <label for="fname">First Name:</label>
        <input type="text" id="fname" name="fname">

        <label for="lname">Last Name:</label>
        <input type="text" id="lname" name="lname">
        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob">

        <label for="age">Age:</label>
        <input type="number" id="age" name="age">
        <br><br>

        <label for="gender">Gender:</label>
        <select id="gender" name="gender">
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <label for="email">Email Address:</label>
        <input type="email" id="email" placeholder="Enter email address">
        <br><br>

        <label>Positions Available:</label>
        <input type="radio" id="junior" name="position">
        <label for="junior">Junior Developer</label>

        <input type="radio" id="mid" name="position">
        <label for="mid">Mid-level Developer</label>

        <input type="radio" id="senior" name="position">
        <label for="senior">Senior Developer</label>
        <br><br>

        <label>Programming Languages:</label>
        <input type="checkbox" id="java">
        <label for="java">Java</label>

        <input type="checkbox" id="js">
        <label for="js">JavaScript</label>

        <input type="checkbox" id="python">
        <label for="python">Python</label>
        <br><br>

        <label for="pass">Password:</label>
        <input type="password" id="pass">

        <label for="cpass">Confirm Password:</label>
        <input type="password" id="cpass">
        <br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

    </form>

</body>
</html>
