<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>
<body>

<h2>Registration Form</h2>

<p>
Of course, all submitted information is kept in the strictest confidence.<br>
You always retain control of your information with D.W. Simpson & Co.<br>
<b>Our services are always at no cost to you.</b>
</p>

<form>

<label for="name">Name:</label>
<input type="text" id="name"><br><br>

<label for="address">Address:</label>
<input type="text" id="address" size="40"><br><br>

<label for="city">City:</label>
<input type="text" id="city">

<label for="state">State/Province:</label>
<input type="text" id="state"><br><br>

<label for="zip">Zip Code:</label>
<input type="text" id="zip"><br><br>

<label for="country">Country:</label>
<input type="text" id="country"><br><br>

<label for="phoneh">Phone (H):</label>
<input type="text" id="phoneh">

<label for="fax">Fax:</label>
<input type="text" id="fax"><br><br>

<label for="phonew">Phone (W):</label>
<input type="text" id="phonew">
(if able to speak freely)<br><br>

<label for="email">Email:</label>
<input type="email" id="email"><br><br>

<label for="company">Company Name:</label>
<input type="text" id="company">
(optional)<br><br>

<label for="region">Desired Region:</label>
<select id="region">
    <option>Other</option>
    <option>Asia</option>
    <option>Europe</option>
</select>

<label for="other">Other:</label>
<input type="text" id="other"><br><br>

<b>Professional designations earned:</b><br>

<input type="checkbox" id="cs">
<label for="cs">College Student</label>

<input type="checkbox" id="as">
<label for="as">Actuarial Student</label>

<input type="checkbox" id="acas">
<label for="acas">ACAS</label>

<input type="checkbox" id="fcas">
<label for="fcas">FCAS</label>

<input type="checkbox" id="asa">
<label for="asa">ASA</label>

<input type="checkbox" id="fsa">
<label for="fsa">FSA</label>

<input type="checkbox" id="ea">
<label for="ea">EA</label>

<input type="checkbox" id="cfa">
<label for="cfa">CFA</label>

<input type="checkbox" id="mba">
<label for="mba">MBA</label>

<input type="checkbox" id="maaa">
<label for="maaa">MAAA</label>

<input type="checkbox" id="fia">
<label for="fia">FIA</label>

<input type="checkbox" id="fcia">
<label for="fcia">FCIA</label>

<input type="checkbox" id="fla">
<label for="fla">FLA</label>

<input type="checkbox" id="fe">
<label for="fe">Financial Engineer</label>

<input type="checkbox" id="ms">
<label for="ms">M.S.</label>

<input type="checkbox" id="phd">
<label for="phd">Ph.D.</label>

<input type="checkbox" id="dm">
<label for="dm">Data Mining</label>

<input type="checkbox" id="quant">
<label for="quant">Quant</label>

<br><br>

<label for="otherdes">Other Designations:</label><br>
<input type="text" id="otherdes" size="50">

<br><br>

<button type="submit">Submit</button>

</form>

</body>
</html>
