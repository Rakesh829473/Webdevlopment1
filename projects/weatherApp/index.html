<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="vh-100 d-flex justify-content-center align-items-center bg-dark"
    style="background: url('https://static9.depositphotos.com/1593759/1168/i/450/depositphotos_11687543-stock-photo-the-sun-above-the-horizon.jpg') no-repeat center center / cover;">

    <div class="container d-flex justify-content-center">

        <!-- Weather Card -->
        <div class="card shadow-lg p-4 rounded-4 bg-info text-white" style="width: 500px;">

            <!-- Search Box -->
            <div class="input-group mb-3">
                <input type="text" id="cityName" class="form-control" placeholder="Enter City Name">
                <button class="btn btn-light" onclick="getWeather()">🔍</button>
            </div>

            <!-- City -->
            <h2 class="text-center" id="City">New Delhi</h2>
            <hr>

            <!-- Location -->
            <p class="text-center mb-2">
                <span id="Location">Delhi, India</span>
            </p>

            <!-- Temperature + Icon -->
            <div class="d-flex justify-content-between align-items-center my-3">

                <div>
                    <h1>
                        <span id="Temperature">35</span> °C
                    </h1>

                    <h5 id="Condition">Cloudy</h5>
                </div>

                <div>
                    <img id="WeatherIcon" src="" width="90">
                </div>

            </div>

            <!-- Weather Details -->
            <div class="card shadow p-3 text-dark rounded-4">

                <div class="row text-center">

                    <!-- Humidity -->
                    <div class="col-6">
                        <p class="mb-1">💧 Humidity</p>
                        <h6>
                            <span id="Humidity">37</span>%
                        </h6>
                    </div>

                    <!-- Wind Speed -->
                    <div class="col-6">
                        <p class="mb-1">🌬 Wind Speed</p>
                        <h6>
                            <span id="WindSpeed">6.1</span> km/h
                        </h6>
                    </div>

                    <!-- Pressure -->
                    <div class="col-6 mt-3">
                        <p class="mb-1">🌡 Pressure</p>
                        <h6>
                            <span id="Pressure">1012</span> hPa
                        </h6>
                    </div>

                    <!-- Visibility -->
                    <div class="col-6 mt-3">
                        <p class="mb-1">👀 Visibility</p>
                        <h6>
                            <span id="Visibility">10</span> km
                        </h6>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript File -->
    <script src="script.js"></script>

</body>

</html>
