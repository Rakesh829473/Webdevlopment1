<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us - Cravings</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<section class="contact-page">
<div class="container h-100">
<div class="row h-100 align-items-center">

<div class="col-lg-5">
<div class="form-card">

<h2 class="fw-bold mb-2">Contact Us</h2>
<p class="text-muted mb-4">Have a question? We'd love to hear from you.</p>

<form>
<input type="text" class="form-control mb-3" placeholder="Full Name">
<input type="email" class="form-control mb-3" placeholder="Email Address">
<input type="tel" class="form-control mb-3" placeholder="Phone Number">
<input type="text" class="form-control mb-3" placeholder="Subject">

<textarea class="form-control mb-3" rows="4" placeholder="Message"></textarea>

<button class="btn btn-main w-100 py-2">Send Message</button>
</form>

</div>
</div>

</div>
</div>
</section>

</body>
</html>
