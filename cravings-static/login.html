<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Cravings</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<section class="auth-page">
<div class="container-fluid">
<div class="row min-vh-100">

<!-- Left Panel -->
<div class="col-lg-6 d-none d-lg-flex auth-side">
<div class="auth-content text-white text-center">
<h1 class="fw-bold">Welcome Back!</h1>
<p>Login to continue ordering your favourite meals.</p>
</div>
</div>

<!-- Right Panel -->
<div class="col-lg-6 d-flex align-items-center justify-content-center auth-form-wrap">
<div class="auth-box">

<h2 class="fw-bold mb-4">Login</h2>

<form>
<input type="email" class="form-control mb-3" placeholder="Email Address">

<div class="position-relative mb-3">
<input type="password" class="form-control" placeholder="Password">
<span class="eye-icon">👁</span>
</div>

<div class="form-check mb-3">
<input class="form-check-input" type="checkbox">
<label class="form-check-label">Remember me</label>
</div>

<button class="btn btn-main w-100 py-2">Login</button>

<p class="text-center mt-4">
Don't have an account?
<a href="register.html">Register</a>
</p>

</form>

</div>
</div>

</div>
</div>
</section>

</body>
</html>
